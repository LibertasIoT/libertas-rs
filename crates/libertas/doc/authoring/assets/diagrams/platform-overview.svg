<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title description">
  <title id="title">How Libertas components work together</title>
  <desc id="description">Studio prepares an App from source and deploys it to a Hub. The Hub runs configured tasks. People use Studio, Android, or iOS to configure tasks and use their controls and results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#405a75" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1100" height="400" rx="20" fill="#f5f8fc"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="550" y="43" fill="#172c43" font-size="24" font-weight="700">From an App to something people can use</text>
    <rect x="35" y="100" width="275" height="190" rx="14" fill="#ffffff" stroke="#a4b9cd" stroke-width="2"/>
    <text x="172" y="142" fill="#172c43" font-size="24" font-weight="700">Studio</text>
    <text x="172" y="181" fill="#334c66" font-size="18">App source</text>
    <text x="172" y="212" fill="#334c66" font-size="18">Schema and descriptions</text>
    <text x="172" y="253" fill="#334c66" font-size="16">Prepare and validate</text>
    <path d="M320 190 H400" fill="none" stroke="#405a75" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="362" y="171" fill="#334c66" font-size="16">Deploy</text>
    <rect x="415" y="100" width="270" height="190" rx="14" fill="#e8f0ff" stroke="#557fc1" stroke-width="2"/>
    <text x="550" y="142" fill="#172c43" font-size="24" font-weight="700">Hub</text>
    <text x="550" y="181" fill="#334c66" font-size="18">Installed Apps</text>
    <text x="550" y="212" fill="#334c66" font-size="18">Configured tasks</text>
    <text x="550" y="253" fill="#334c66" font-size="16">Run the functionality</text>
    <path d="M699 190 H779" fill="none" stroke="#405a75" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="740" y="156" fill="#334c66" font-size="15">Controls</text>
    <text x="740" y="226" fill="#334c66" font-size="15">Results</text>
    <rect x="795" y="100" width="270" height="190" rx="14" fill="#ffffff" stroke="#a4b9cd" stroke-width="2"/>
    <text x="930" y="142" fill="#172c43" font-size="24" font-weight="700">Clients</text>
    <text x="930" y="181" fill="#334c66" font-size="18">Studio · Android · iOS</text>
    <text x="930" y="212" fill="#334c66" font-size="18">Settings, actions, and data</text>
    <text x="930" y="253" fill="#334c66" font-size="16">Help people use the App</text>
    <text x="550" y="340" fill="#172c43" font-size="18">App = reusable functionality · Task = one configured use of a function</text>
    <text x="550" y="373" fill="#405a75" font-size="16">Available operations depend on the App and the person's permissions.</text>
  </g>
</svg>
