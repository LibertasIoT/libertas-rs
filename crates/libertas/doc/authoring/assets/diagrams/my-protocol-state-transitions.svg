    <text x="155" y="967" class="line-number" text-anchor="end" fill="#8494a6" aria-hidden="true">15</text>
    <text x="197" y="967" class="code" xml:space="preserve">    #[<tspan fill="#7650a8">libertas_response</tspan>]</text>
    <text x="155" y="1008.5" class="line-number" text-anchor="end" fill="#8494a6" aria-hidden="true">16</text>
    <text x="197" y="1008.5" class="code" xml:space="preserve">    <tspan fill="#7650a8">Response2</tspan> {},</text>
