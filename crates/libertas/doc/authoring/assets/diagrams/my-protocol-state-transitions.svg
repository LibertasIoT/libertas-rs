    <rect x="1196" y="219" width="1124" height="1040" rx="24" fill="#fff" stroke="#dce4ed" stroke-width="2"/>
    <text x="120" y="284" font-size="34" font-weight="700">Rust declaration</text>
    <text x="1118" y="282" font-size="22" text-anchor="end" fill="#60758a">MyProtocol</text>
    <path d="M80 312 H1160 M1196 312 H2320" stroke="#e4eaf1" stroke-width="2"/>
    <text x="1236" y="284" font-size="34" font-weight="700">Allowed state transitions</text>

    <rect x="108" y="342" width="1024" height="868" rx="14" fill="#f9fbfe"/>
    <path d="M176 357 V1190" stroke="#e4eaf1" stroke-width="2"/>
