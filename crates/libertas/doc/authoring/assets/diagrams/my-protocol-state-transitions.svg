    <text x="155" y="427.5" class="line-number" text-anchor="end" fill="#8494a6" aria-hidden="true">2</text>
    <text x="197" y="427.5" class="code" xml:space="preserve">    #[<tspan fill="#2165b0">libertas_request</tspan>]</text>
    <text x="155" y="469" class="line-number" text-anchor="end" fill="#8494a6" aria-hidden="true">3</text>
    <text x="197" y="469" class="code" xml:space="preserve">    #[<tspan fill="#2165b0">libertas_next_response</tspan>(<tspan fill="#7650a8">Response1</tspan>,<tspan fill="#7650a8">Response2</tspan>)]</text>
    <text x="155" y="510.5" class="line-number" text-anchor="end" fill="#8494a6" aria-hidden="true">4</text>
    <text x="197" y="510.5" class="code" xml:space="preserve">    <tspan fill="#2165b0">Request1</tspan> {},</text>
