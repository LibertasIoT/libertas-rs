<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1320" viewBox="0 0 2400 1320" role="img" aria-labelledby="title description">
  <title id="title">MyProtocol: from Rust declarations to protocol state transitions</title>
  <desc id="description">The supplied Rust enum appears on the left. All six states appear exactly once on the right, connected by twelve allowed directed transitions. Request1 can transition to Response1 or Response2. Request2 can transition to Response2 or Response3. Request3 can transition to Response3 or Response1. Response1 can transition to Request2 or Request3. Response2 can transition to Request3 or Request1. Response3 can transition to Request1 or Request2. Three double-headed links each represent two opposite transitions. One interior crossing has no junction.</desc>
  <defs>
    <marker id="response-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2165b0"/>
    </marker>
    <marker id="request-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="18" markerHeight="18" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#7650a8"/>
    </marker>
    <style>
      text { font-family: Arial, 'DejaVu Sans', sans-serif; }
      .code, .line-number { font-family: 'DejaVu Sans Mono', monospace; font-size: 27px; }
      .node-label { font-family: 'DejaVu Sans Mono', monospace; font-size: 29px; font-weight: 700; }
    </style>
  </defs>
  <rect width="2400" height="1320" fill="#f4f7fb"/>
  <g fill="#18324c">
    <text x="80" y="106" font-size="62" font-weight="700">MyProtocol: code to state transitions</text>
    <text x="82" y="164" font-size="29" fill="#53677b">Six variants. Twelve allowed transitions. Each annotation names the permitted next messages.</text>

