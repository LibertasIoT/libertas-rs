<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1013" viewBox="0 0 920 1013">
  <style>
    text {
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
    }
  </style>

  <rect width="920" height="1032" fill="#faf9fe"/>

  <!-- Status bar -->
  <text x="74" y="80" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#000000">12:08</text>
  <g fill="#000000">
    <rect x="675" y="67" width="7" height="13" rx="3.5"/>
    <rect x="687" y="60" width="7" height="20" rx="3.5"/>
    <rect x="699" y="53" width="7" height="27" rx="3.5"/>
    <rect x="711" y="45" width="7" height="35" rx="3.5"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="5.5" stroke-linecap="round">
    <path d="M731 60 Q748 43 765 60"/>
    <path d="M738 67 Q748 57 758 67"/>
  </g>
  <circle cx="748" cy="73" r="3.7" fill="#000000"/>
  <rect x="780" y="50" width="61" height="30" rx="8" fill="#000000"/>
  <rect x="841" y="58" width="5" height="14" rx="2.5" fill="#d8d8dc"/>
  <rect x="820" y="50" width="21" height="30" rx="0" fill="#e3e3e8" opacity="0.9"/>

  <!-- Header -->
  <g fill="none" stroke="#2f323a" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M72 188 L50 204 L72 220"/>
    <path d="M52 204 H78"/>
  </g>

  <!-- house/yard icon -->
  <g transform="translate(112,162)">
    <!-- dark yard block -->
    <rect x="7" y="39" width="63" height="31" fill="#5f636d"/>

    <!-- winding path cut through the yard -->
    <path d="M13 52
             C18 45, 30 43, 39 46
             C49 49, 56 53, 62 59
             C66 63, 68 66, 70 70
             L44 70
             C42 67, 39 64, 33 61
             C26 57, 17 57, 11 60
             C8 57, 9 54, 13 52 Z"
          fill="#faf9fe"/>

    <!-- house -->
    <path d="M16 31
             L16 52
             L57 52
             L57 31
             L63 31
             L50 20
             L50 8
             L42 8
             L42 14
             L36 9
             L10 31
             Z"
          fill="#faf9fe"
          stroke="#7a7e89"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- door and window -->
    <rect x="27" y="34" width="10" height="18" rx="1.5" fill="#666a75"/>
    <rect x="44" y="35" width="12" height="11" rx="1.2" fill="#666a75"/>
  </g>
  <text x="198" y="219" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="46" font-weight="400" fill="#2f323a">前院</text>

  <!-- microphone -->
  <g transform="translate(742,179)" fill="none" stroke="#5c5f68" stroke-width="5" stroke-linecap="round">
    <rect x="11" y="0" width="12" height="29" rx="6" fill="#5c5f68" stroke="none"/>
    <path d="M5 19 V22 C5 31 11 37 17 37 C23 37 29 31 29 22 V19"/>
    <path d="M17 37 V47"/>
  </g>

  <!-- help -->
  <g transform="translate(839,184)" fill="none" stroke="#5c5f68" stroke-width="4">
    <circle cx="21" cy="21" r="19"/>
    <path d="M14 15 C15 8, 27 8, 28 15 C28 20, 23 21, 21 25 C20 27,20 29,20 30" stroke-linecap="round"/>
    <circle cx="20" cy="35" r="2.2" fill="#5c5f68" stroke="none"/>
  </g>

  <!-- Settings section -->
  <g fill="none" stroke="#5c5f68" stroke-width="4" stroke-linecap="square">
    <path d="M48 355 L58 365 L68 355"/>
  </g>
  <text x="91" y="378" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="45" font-weight="400" fill="#5c5f68">设置</text>

  <g transform="translate(819,345)" fill="none" stroke="#3f424a" stroke-width="3.5">
    <rect x="0" y="0" width="35" height="35"/>
    <rect x="6" y="6" width="5" height="5" fill="#3f424a" stroke="none"/>
    <rect x="6" y="15" width="5" height="5" fill="#3f424a" stroke="none"/>
    <rect x="6" y="24" width="5" height="5" fill="#3f424a" stroke="none"/>
    <line x1="16" y1="8.5" x2="28" y2="8.5"/>
    <line x1="16" y1="17.5" x2="28" y2="17.5"/>
    <line x1="16" y1="26.5" x2="28" y2="26.5"/>
  </g>

  <!-- divider -->
  <rect x="0" y="436" width="920" height="2" fill="#b2b3be"/>

  <!-- Water amount -->
  <text x="65" y="506" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="45" font-weight="400" fill="#5c5f68">水量</text>
  <text x="678" y="506" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="45" font-weight="400" fill="#2f323a">100</text>
  <circle cx="794" cy="491" r="24" fill="#b6ccff"/>
  <text x="784" y="502" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="500" fill="#36578a">%</text>
  <g fill="none" stroke="#5c5f68" stroke-width="4" stroke-linecap="square">
    <path d="M856 521 L866 531 L856 541"/>
  </g>
  <text x="65" y="557" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#5c5f68">推荐水量使用 100%；较低值表示减少水量，较高值表示增</text>
  <text x="65" y="598" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#5c5f68">加水量。</text>

  <rect x="0" y="630" width="920" height="2" fill="#b0b1bc"/>

  <!-- No-watering periods -->
  <g fill="none" stroke="#5c5f68" stroke-width="4" stroke-linecap="square">
    <path d="M80 698 L91 709 L102 698"/>
  </g>
  <text x="124" y="704" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="45" font-weight="400" fill="#5c5f68">禁止浇水时段</text>
  <text x="124" y="753" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#5c5f68">必须暂停浇水的时间段。</text>
  <g fill="none" stroke="#5c5f68" stroke-width="4" stroke-linecap="square">
    <path d="M856 694 L866 704 L856 714"/>
  </g>

  <rect x="0" y="785" width="920" height="2" fill="#b0b1bc"/>

  <!-- Active -->
  <text x="65" y="883" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="45" font-weight="400" fill="#5c5f68">启用</text>
  <rect x="711" y="844" width="110" height="64" rx="32" fill="#e1e1e6"/>
  <circle cx="786" cy="876" r="27" fill="#faf9fe"/>
  <g fill="none" stroke="#5c5f68" stroke-width="4" stroke-linecap="square">
    <path d="M856 896 L866 906 L856 916"/>
  </g>
  <text x="65" y="958" font-family="Roboto, Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#5c5f68">打开自动浇水。完成系统冬季防护后将其关闭。</text>

  <rect x="0" y="1010" width="920" height="3" fill="#b3b4bf"/>
</svg>
